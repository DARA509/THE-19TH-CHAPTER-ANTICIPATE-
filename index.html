<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The 19th Chapter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Jost:wght@300;400;500&display=swap">
<style>
  /* Layout: the photo fills the page; one centered column (title, subtitle, countdown, date) floats over it, with a song button pinned at the bottom. */
  :root {
    --ink: #0b0a10;
    --veil: rgba(11, 10, 16, 0.12);
    --gold: #d9b45a;
    --gold-soft: #f0d99a;
    --gold-deep: #a9832f;
    --paper: #f6f1e4;
    --mute: #bdb6a4;
    --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --body: "Jost", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }

  /* Background */
  .bg {
    position: fixed; inset: -3%; z-index: 0;
    background-color: #141218;
    background-image: url("top.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    animation: drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: scale(1) translate3d(0, 0, 0); }
    to   { transform: scale(1.07) translate3d(-1%, 1%, 0); }
  }
  .veil {
    position: fixed; inset: 0; z-index: 1;
    background:
      radial-gradient(ellipse 70% 60% at 50% 48%, rgba(11,10,16,0.5) 0%, rgba(11,10,16,0.06) 100%),
      linear-gradient(to bottom, rgba(11,10,16,0.4) 0%, rgba(11,10,16,0) 25%, rgba(11,10,16,0) 70%, rgba(11,10,16,0.5) 100%),
      var(--veil);
  }
  #fx { position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; }

  main {
    position: relative; z-index: 3;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(26px, 5.5vh, 52px);
    padding-block: max(32px, env(safe-area-inset-top, 0px)) max(96px, calc(env(safe-area-inset-bottom, 0px) + 84px));
    text-align: center;
  }

  .rise { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .rise.d1 { animation-delay: 0.15s; }
  .rise.d2 { animation-delay: 0.35s; }
  .rise.d3 { animation-delay: 0.55s; }
  @keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); } to { opacity: 1; transform: none; } }

  .heading { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2.2vw, 20px); min-width: 0; }

  h1 {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 0.24em;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 8.4vw, 6.4rem);
    line-height: 0.95;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  h1 .name {
    background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold-soft) 28%, #fff6d8 40%, var(--gold-soft) 52%, var(--gold-deep) 100%);
    background-size: 250% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 2px 30px rgba(217, 180, 90, 0.3));
    animation: shimmer 5.5s ease-in-out 1.2s infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 55%, 100% { background-position: 0% 0; } }
  .crown {
    width: 1em; height: 0.8em; flex: none;
    fill: url(#goldFill);
    filter: drop-shadow(0 2px 18px rgba(217, 180, 90, 0.5));
    margin-top: -0.1em;
    animation: bob 4.5s ease-in-out infinite;
  }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4%); } }

  .sub {
    margin: 0;
    display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vw, 24px);
    font-weight: 400;
    font-size: clamp(0.78rem, 2.5vw, 1.1rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--paper);
  }
  .sub span { padding-left: 0.5em; }
  .sub::before, .sub::after {
    content: ""; height: 1px; width: clamp(24px, 9vw, 96px);
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .sub::after { transform: scaleX(-1); }

  /* Countdown */
  .count {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    width: min(100%, 760px);
  }
  .unit {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vw, 14px);
    padding: clamp(14px, 2.8vw, 26px) 2px;
    min-width: 0;
  }
  .unit + .unit::before {
    content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(217,180,90,0.55), transparent);
  }
  .num {
    display: block;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(2.1rem, 9.6vw, 5rem);
    line-height: 1;
    color: var(--paper);
    text-shadow: 0 2px 28px rgba(0,0,0,0.55);
    font-variant-numeric: tabular-nums;
  }
  .num.flip { animation: flip 0.45s ease-out; }
  @keyframes flip { from { opacity: 0.2; transform: translateY(-14%); } to { opacity: 1; transform: none; } }
  .lbl {
    font-size: clamp(0.6rem, 1.9vw, 0.78rem);
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  .done {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.8rem, 7vw, 4rem);
    color: var(--gold-soft);
    letter-spacing: 0.06em;
    text-wrap: balance;
  }
  .done[hidden], .count[hidden] { display: none; }

  .date {
    margin: 0;
    font-size: clamp(0.72rem, 2vw, 0.85rem);
    letter-spacing: 0.34em;
    padding-left: 0.34em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* Song button */
  .music {
    position: fixed; z-index: 4;
    left: 50%; transform: translateX(-50%);
    bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 14px));
    appearance: none;
    display: inline-flex; align-items: center; gap: 14px;
    background: rgba(11, 10, 16, 0.55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--gold-soft);
    border: 1px solid rgba(217, 180, 90, 0.65);
    border-radius: 999px;
    padding: 13px 26px 13px 22px;
    font: 500 0.76rem/1 var(--body);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .music:hover { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .music:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 4px; }
  .music[hidden] { display: none; }
  .bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; }
  .bars i { width: 3px; height: 4px; background: currentColor; display: block; border-radius: 1px; }
  .music.on .bars i { animation: eq 0.9s ease-in-out infinite; }
  .music.on .bars i:nth-child(2) { animation-delay: 0.2s; }
  .music.on .bars i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }

  @media (prefers-reduced-motion: reduce) {
    .bg, .crown, h1 .name, .rise, .num.flip { animation: none !important; }
    h1 .name { background-position: 0 0; }
    .music.on .bars i { animation: none; height: 10px; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="goldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a2"/><stop offset="0.5" stop-color="#d9b45a"/><stop offset="1" stop-color="#a9832f"/>
    </linearGradient>
  </defs>
</svg>

<div class="bg" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <div class="heading rise">
    <h1>
      <span class="name">KING DAVID</span>
      <svg class="crown" viewBox="0 0 100 80" aria-hidden="true">
        <path d="M6 66 L0 18 L26 40 L50 6 L74 40 L100 18 L94 66 Z"/>
        <rect x="6" y="70" width="88" height="10" rx="1.5"/>
        <circle cx="0" cy="16" r="5"/><circle cx="50" cy="4" r="5.5"/><circle cx="100" cy="16" r="5"/>
      </svg>
    </h1>
    <p class="sub"><span>The 19th Chapter</span></p>
  </div>

  <div class="count rise d1" id="count" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="d">--</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">--</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">--</span><span class="lbl">Minutes</span></div>
    <div class="unit"><span class="num" id="s">--</span><span class="lbl">Seconds</span></div>
  </div>
  <div class="done" id="done" hidden>The 19th Chapter begins</div>

  <p class="date rise d2">3 January 2027</p>
</main>

<button class="music rise d3" id="music" type="button" hidden>
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  <span id="musicLabel">Play song</span>
</button>
<audio id="song" src="song.mp3" preload="auto" loop></audio>

<script>
  // Midnight at the start of 3 January 2027, Lagos time (UTC+1)
  var TARGET = new Date("2027-01-03T00:00:00+01:00").getTime();
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = {
    d: document.getElementById("d"), h: document.getElementById("h"),
    m: document.getElementById("m"), s: document.getElementById("s"),
    count: document.getElementById("count"), done: document.getElementById("done")
  };
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function setNum(node, text) {
    if (node.textContent === text) return;
    node.textContent = text;
    if (reduce) return;
    node.classList.remove("flip");
    void node.offsetWidth;
    node.classList.add("flip");
  }
  var celebrated = false;
  function tick() {
    var left = TARGET - Date.now();
    if (left <= 0) {
      el.count.hidden = true;
      el.done.hidden = false;
      if (!celebrated) { celebrated = true; confetti(); }
      return false;
    }
    var secs = Math.floor(left / 1000);
    setNum(el.d, String(Math.floor(secs / 86400)));
    setNum(el.h, pad(Math.floor((secs % 86400) / 3600)));
    setNum(el.m, pad(Math.floor((secs % 3600) / 60)));
    setNum(el.s, pad(secs % 60));
    return true;
  }

  // Gold dust and confetti share one canvas
  var cv = document.getElementById("fx");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, dpr = 1;
  var dust = [], bits = [];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function newDust(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 10,
      r: 0.6 + Math.random() * 1.8,
      vy: 0.12 + Math.random() * 0.4,
      sway: Math.random() * Math.PI * 2,
      a: 0.25 + Math.random() * 0.55
    };
  }
  function confetti() {
    if (reduce) return;
    var colors = ["#f0d99a", "#d9b45a", "#f6f1e4", "#a9832f"];
    for (var i = 0; i < 190; i++) {
      bits.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
        w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
        vy: 2 + Math.random() * 3.5, vx: -1 + Math.random() * 2,
        rot: Math.random() * 6.28, vr: -0.2 + Math.random() * 0.4,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < dust.length; i++) {
      var p = dust[i];
      p.y -= p.vy; p.sway += 0.01;
      p.x += Math.sin(p.sway) * 0.25;
      if (p.y < -10) dust[i] = newDust(false);
      ctx.beginPath();
      ctx.fillStyle = "rgba(240,217,154," + p.a + ")";
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fill();
    }
    for (var j = bits.length - 1; j >= 0; j--) {
      var b = bits[j];
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      if (b.y > H + 30) { bits.splice(j, 1); continue; }
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener("resize", resize);
  var n = Math.round(Math.min(70, Math.max(28, (window.innerWidth * window.innerHeight) / 18000)));
  for (var k = 0; k < n; k++) dust.push(newDust(true));
  if (reduce) {
    ctx.clearRect(0, 0, W, H);
    dust.forEach(function (p) {
      ctx.beginPath(); ctx.fillStyle = "rgba(240,217,154," + p.a + ")";
      ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    });
  } else {
    requestAnimationFrame(frame);
  }

  if (tick()) {
    var timer = setInterval(function () { if (!tick()) clearInterval(timer); }, 1000);
  }

  // Song: the button appears once song.mp3 has loaded. Sound starts only on tap.
  var audio = document.getElementById("song");
  var btn = document.getElementById("music");
  var label = document.getElementById("musicLabel");
  audio.addEventListener("loadedmetadata", function () { btn.hidden = false; });
  audio.addEventListener("error", function () { btn.hidden = true; });
  btn.addEventListener("click", function () {
    if (audio.paused) {
      audio.play().then(function () {
        btn.classList.add("on"); label.textContent = "Pause song";
      }).catch(function () {});
    } else {
      audio.pause();
      btn.classList.remove("on"); label.textContent = "Play song";
    }
  });
</script>

</body></html>
